services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: sacakly
      POSTGRES_USER: sacakly
      POSTGRES_PASSWORD: sacakly
    ports:
      - "5432:5432"
    volumes:
      - sacakly_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacakly -d sacakly"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:latest@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sacakly
      MINIO_ROOT_PASSWORD: sacakly-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sacakly_minio:/data

volumes:
  sacakly_postgres:
  sacakly_minio:
