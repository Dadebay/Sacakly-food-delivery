name: ${ALOWALOW_COMPOSE_PROJECT:-alowalow-production}

services:
  migrate:
    image: ${ALOWALOW_MIGRATION_IMAGE:?Set the immutable migration image reference}
    pull_policy: always
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.production}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${ALOWALOW_API_IMAGE:?Set the immutable API image reference}
    pull_policy: always
    env_file:
      - ${ALOWALOW_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ALOWALOW_API_PORT:-4000}:4000"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin:
    image: ${ALOWALOW_ADMIN_IMAGE:?Set the immutable admin image reference}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ALOWALOW_ADMIN_PORT:-3000}:8080"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
