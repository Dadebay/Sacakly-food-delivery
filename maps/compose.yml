name: alowalow-maps

services:
  tileserver:
    image: maptiler/tileserver-gl:v5.6.0@sha256:3a9ccdb24820b6814c8119bcc8a4376c39867cb0ffe69d62919ef898b90c2427
    init: true
    restart: unless-stopped
    command:
      - --config
      - /data/config.json
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${MAP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      XDG_CACHE_HOME: /tmp/cache
    ports:
      - "${MAP_BIND_ADDRESS:-127.0.0.1}:${MAP_PORT:-8080}:8080"
    volumes:
      - ./runtime:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "/usr/src/app/src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
