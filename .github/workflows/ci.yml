name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  legacy-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --prefix apps/admin --no-audit --no-fund
      - run: npm --prefix apps/admin run lint
      - run: npm --prefix apps/admin test
      - run: npm --prefix apps/admin audit --audit-level=low

  merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/merchant/package-lock.json
      - run: npm ci --prefix apps/merchant --no-audit --no-fund
      - run: npm --prefix apps/merchant run lint
      - run: npm --prefix apps/merchant run build
      - run: npm --prefix apps/merchant test
      - run: npm --prefix apps/merchant audit --audit-level=low

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api --no-audit --no-fund
      - run: docker compose up -d --wait postgres redis minio
      - run: node apps/api/scripts/init-local-s3.mjs
      - run: npm --prefix apps/api run lint
      - run: npm --prefix apps/api run build
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/api audit --audit-level=low
      - if: always()
        run: docker compose down --volumes --remove-orphans
