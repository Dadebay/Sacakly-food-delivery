version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
    groups:
      root-tooling:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
    groups:
      admin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Asia/Ashgabat
    open-pull-requests-limit: 5
